<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo de login</title>
<style>
  :root { --fondo:#16313a; --panel:#1f4450; --borde:#c9a24b; --texto:#eef1e6; --suave:#a9c0c4; --error:#ffb4a2; --ok:#b6e3a0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--fondo); color:var(--texto); font-family:Georgia,"Times New Roman",serif; }
  main { width:100%; max-width:400px; background:var(--panel); border:2px solid var(--borde); border-radius:6px; padding:28px 24px; }
  h1 { margin:0 0 6px; font-size:1.7rem; }
  p.sub { margin:0 0 18px; color:var(--suave); font-size:.95rem; }
  label { display:block; margin:14px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:11px; font-size:1rem; border:1px solid var(--suave);
         border-radius:4px; background:#12282f; color:var(--texto); }
  input:focus, button:focus-visible { outline:3px solid var(--borde); outline-offset:1px; }
  .ver { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:.9rem; color:var(--suave); }
  button { font:inherit; cursor:pointer; padding:11px 14px; border-radius:4px; border:1px solid var(--borde); }
  .principal { width:100%; margin-top:20px; background:var(--borde); color:#1a1a1a; font-weight:bold; }
  .secundario { background:transparent; color:var(--texto); }
  .fila { display:flex; gap:10px; margin-top:12px; }
  .fila button { flex:1; }
  #mensaje { min-height:1.4em; margin:12px 0 0; font-weight:bold; }
  #mensaje.error { color:var(--error); } #mensaje.ok { color:var(--ok); }
  .dato { margin:14px 0; } .dato span { display:block; color:var(--suave); font-size:.9rem; }
  .dato strong { font-size:1.25rem; word-break:break-all; }
  .objetos { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .objeto { border:1px solid var(--borde); border-radius:20px; padding:4px 12px; }
  #modo { margin-top:20px; font-size:.8rem; color:var(--suave); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>

  <!-- PANTALLA 1: LOGIN -->
  <section id="pantalla-login">
    <h1>Bienvenido</h1>
    <p class="sub">Entra con tu cuenta para ver tu perfil.</p>
    <label for="login-usuario">Usuario</label>
    <input type="text" id="login-usuario" autocomplete="off">
    <label for="login-clave">Contraseña</label>
    <input type="password" id="login-clave" autocomplete="off">
    <button class="principal" id="btn-entrar">Entrar</button>
    <div class="fila">
      <button class="secundario" id="btn-crear">Crear cuenta</button>
      <button class="secundario" id="btn-registro">registro</button>
    </div>
  </section>

  <!-- PANTALLA 2: REGISTRO -->
  <section id="pantalla-registro" hidden>
    <h1>Crear cuenta</h1>
    <p class="sub">Elige un usuario y una contraseña de 8 o más caracteres, con mayúscula, minúscula, número y símbolo.</p>
    <label for="reg-usuario">Usuario</label>
    <input type="text" id="reg-usuario" autocomplete="off">
    <label for="reg-clave">Contraseña</label>
    <input type="password" id="reg-clave" autocomplete="off">
    <button class="principal" id="btn-registrar">Registrarme</button>
    <div class="fila"><button class="secundario" id="btn-volver">Volver</button></div>
  </section>

  <!-- PANTALLA 3: PERFIL -->
  <section id="pantalla-perfil" hidden>
    <h1>Tu perfil</h1>
    <div class="dato"><span>Usuario</span><strong id="p-usuario"></strong></div>
    <div class="dato"><span>Objetos</span><div class="objetos" id="p-objetos"></div></div>
    <div class="dato"><span>Monedas</span><strong id="p-monedas"></strong></div>
    <button class="principal" id="btn-salir">Salir</button>
  </section>

  <p id="mensaje" role="status"></p>
  <p id="modo"></p>
</main>

<script>
/* =====================================================================
   CONFIGURACIÓN
   Si dejas estas dos líneas vacías, los datos se guardan en tu navegador
   ("modo local"). Si pegas tus datos de Supabase, se guardan en Supabase.
   ===================================================================== */
const SUPABASE_URL = "https://ceffoxyfplyvcokxrkbv.supabase.co/";   // ejemplo: "https://abcdefgh.supabase.co"
const SUPABASE_KEY = "sb_publishable_QVjI1IrZDas64n4wR3LNgA_GB2mIg5W";   // la clave "anon" o "publishable" de tu proyecto

/* ===== INICIO LÓGICA (no toca la pantalla; así se puede probar con Node) ===== */
const OBJETOS_POSIBLES = ["espada","escudo","poción","arco","flechas","llave","mapa","casco","anillo","pergamino","antorcha","botas"];

// Sortea de 1 a 4 objetos distintos y de 10 a 500 monedas.
function generarBotin(azar) {
  azar = azar || Math.random;
  const cantidad = 1 + Math.floor(azar() * 4);
  const bolsa = OBJETOS_POSIBLES.slice();
  const objetos = [];
  for (let i = 0; i < cantidad; i++) {
    const posicion = Math.floor(azar() * bolsa.length);
    objetos.push(bolsa.splice(posicion, 1)[0]); // sacar de la bolsa evita repetidos
  }
  return { objetos: objetos.join(", "), monedas: 10 + Math.floor(azar() * 491) };
}

// "Almacén" = el lugar donde se guardan los usuarios. Tiene dos operaciones: buscar y crear.
function crearAlmacenLocal(memoria) {
  const CLAVE = "demo_usuarios";
  const leer = () => JSON.parse(memoria.getItem(CLAVE) || "[]");
  return {
    async buscar(nombre) { return leer().find(u => u.nombre_usuario === nombre) || null; },
    async crear(u) {
      const lista = leer();
      u.id = lista.length ? Math.max(...lista.map(x => x.id)) + 1 : 1;
      lista.push(u);
      memoria.setItem(CLAVE, JSON.stringify(lista));
      return u;
    }
  };
}

function crearAlmacenSupabase(url, clave, pedir) {
  const base = url.replace(/\/+$/, "") + "/rest/v1/usuarios";
  const cabeceras = { "apikey": clave, "Content-Type": "application/json" };
  if (!clave.startsWith("sb_")) cabeceras["Authorization"] = "Bearer " + clave;
  return {
    async buscar(nombre) {
      const r = await pedir(base + "?select=*&nombre_usuario=eq." + encodeURIComponent(nombre), { headers: cabeceras });
      if (!r.ok) throw new Error("Supabase respondió " + r.status);
      const filas = await r.json();
      return filas[0] || null;
    },
    async crear(u) {
      const r = await pedir(base, { method: "POST", headers: Object.assign({ "Prefer": "return=representation" }, cabeceras), body: JSON.stringify(u) });
      if (r.status === 409) return "DUPLICADO";
      if (!r.ok) throw new Error("Supabase respondió " + r.status);
      return (await r.json())[0];
    }
  };
}

// Devuelve la lista de reglas que NO cumple la contraseña (vacía = cumple todas). 
  function validarContrasena(clave) {   clave = clave || "";   const faltan = [];   if ([...clave].length < 8) faltan.push("al menos 8 caracteres");   if (!/\p{Lu}/u.test(clave)) faltan.push("una mayúscula");   if (!/\p{Ll}/u.test(clave)) faltan.push("una minúscula");   if (!/[0-9]/.test(clave)) faltan.push("un número");   if (!/[^\p{L}\p{N}\s]/u.test(clave)) faltan.push("un símbolo");   return faltan; }  async function registrar(almacen, nombre, clave, azar) {
  nombre = (nombre || "").trim();
  if (!nombre) return { ok: false, mensaje: "Escribe un nombre de usuario." };
    const faltan = validarContrasena(clave);
  if (faltan.length) return { ok: false, mensaje: "La contraseña debe tener " + faltan.join(", ") + "." };
  if (await almacen.buscar(nombre)) return { ok: false, mensaje: "Ese usuario ya existe. Elige otro." };
  const botin = generarBotin(azar);
  const resultado = await almacen.crear({ nombre_usuario: nombre, contrasena: clave || "",  contrasena_hash: await hashearContrasena(clave), objetos: botin.objetos, monedas: botin.monedas });
  if (resultado === "DUPLICADO") return { ok: false, mensaje: "Ese usuario ya existe. Elige otro." };
  return { ok: true, mensaje: "Registro exitoso" };
}
const ITERACIONES = 210000;
const aB64 = bytes => btoa(String.fromCharCode(...bytes));
const deB64 = texto => Uint8Array.from(atob(texto), c => c.charCodeAt(0));

async function derivar(clave, sal, iteraciones) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sal, iterations: iteraciones, hash: "SHA-256" }, material, 256);
  return new Uint8Array(bits);
}

async function hashearContrasena(clave) {
  const sal = crypto.getRandomValues(new Uint8Array(16));
  const hash = await derivar(clave || "", sal, ITERACIONES);
  return "pbkdf2$" + ITERACIONES + "$" + aB64(sal) + "$" + aB64(hash);
}

async function verificarContrasena(clave, guardado) {
  const partes = (guardado || "").split("$");
  if (partes.length !== 4 || partes[0] !== "pbkdf2") return false;
  const hash = await derivar(clave || "", deB64(partes[2]), parseInt(partes[1], 10));
  return aB64(hash) === partes[3];
}
  
async function iniciarSesion(almacen, nombre, clave) {
  nombre = (nombre || "").trim();
  const u = await almacen.buscar(nombre);
  if (!u || !(await verificarContrasena(clave, u.contrasena_hash))) return { ok: false, mensaje: "Usuario o contraseña incorrectos." };
  return { ok: true, usuario: u };
}
/* ===== FIN LÓGICA ===== */

/* ===== PANTALLA ===== */
if (typeof document !== "undefined") {
  const $ = id => document.getElementById(id);
  const modoSupabase = SUPABASE_URL && SUPABASE_KEY;
  const almacen = modoSupabase
    ? crearAlmacenSupabase(SUPABASE_URL, SUPABASE_KEY, (u, o) => fetch(u, o))
    : crearAlmacenLocal(window.localStorage);
  $("modo").textContent = modoSupabase ? "Datos guardados en Supabase." : "Modo local: los datos se guardan solo en este navegador.";

  function mostrar(nombrePantalla) {
    ["login", "registro", "perfil"].forEach(n => $("pantalla-" + n).hidden = (n !== nombrePantalla));
  }
  function aviso(texto, tipo) { $("mensaje").textContent = texto || ""; $("mensaje").className = tipo || ""; }

  function mostrarPerfil(u) {
    $("p-usuario").textContent = u.nombre_usuario;
    $("p-monedas").textContent = u.monedas;
    const caja = $("p-objetos"); caja.innerHTML = "";
    const lista = (u.objetos || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!lista.length) caja.textContent = "Ninguno";
    lista.forEach(o => { const s = document.createElement("span"); s.className = "objeto"; s.textContent = o; caja.appendChild(s); });
    mostrar("perfil"); aviso("");
  }
  function irAlRegistro() { aviso(""); mostrar("registro"); }
  async function seguro(tarea) {
    try { await tarea(); } catch (e) { aviso("Error: " + e.message + ". Revisa tu conexión y la configuración.", "error"); }
  }

  $("btn-crear").onclick = irAlRegistro;
  $("btn-registro").onclick = irAlRegistro;
  $("btn-volver").onclick = () => { aviso(""); mostrar("login"); };

  $("btn-registrar").onclick = () => seguro(async () => {
    const r = await registrar(almacen, $("reg-usuario").value, $("reg-clave").value);
    if (!r.ok) return aviso(r.mensaje, "error");
    $("reg-usuario").value = ""; $("reg-clave").value = "";
    mostrar("login"); aviso(r.mensaje, "ok");
  });

  $("btn-entrar").onclick = () => seguro(async () => {
    const r = await iniciarSesion(almacen, $("login-usuario").value, $("login-clave").value);
    if (!r.ok) return aviso(r.mensaje, "error");
    localStorage.setItem("demo_sesion", r.usuario.nombre_usuario); // recordar la sesión
    $("login-usuario").value = ""; $("login-clave").value = "";
    mostrarPerfil(r.usuario);
  });

  $("btn-salir").onclick = () => { localStorage.removeItem("demo_sesion"); mostrar("login"); aviso(""); };

  // Al abrir o recargar: si hay sesión guardada, ir directo al perfil.
  seguro(async () => {
    const guardado = localStorage.getItem("demo_sesion");
    if (!guardado) return;
    const u = await almacen.buscar(guardado);
    if (u) mostrarPerfil(u); else localStorage.removeItem("demo_sesion");
  });
}
</script>
</body>
</html>
